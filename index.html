<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShareSafe Practice: Digital Survival Curriculum, private and offline</title>
  <meta name="description" content="Digital Survival Curriculum for shared and low-end devices. No accounts, works offline, private by default. Teachers can hand out a pack with a QR code.">
  <meta name="theme-color" content="#0b4f8a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header class="top">
    <a class="brand" href="./" data-go="home">ShareSafe Practice</a>
    <div class="toolbar" role="group" aria-label="Display, language and reading options">
      <button type="button" id="t-size" class="secondary">Text size: Normal</button>
      <button type="button" id="t-contrast" class="secondary" aria-pressed="false">High contrast</button>
      <button type="button" id="t-plain" class="secondary" aria-pressed="false">Plain language</button>
      <button type="button" id="t-lang" class="secondary" lang="en">English</button>
    </div>
  </header>
  <p id="net" class="net" role="status" hidden></p>
  <main id="main" tabindex="-1"></main>
  <p id="escape-live" class="sr-only" role="status" aria-live="polite"></p>
  <footer class="foot">
    <p><span id="mode-status"></span> <span id="sw-status"></span></p>
    <p id="storage-badge" class="storage-badge" role="status" data-persistent-bytes="0"></p>
    <div class="row">
      <button type="button" class="secondary" data-go="code" id="f-code">Resume code</button>
      <button type="button" class="danger" data-go="end" id="f-end">Wipe session</button>
      <button type="button" class="link" data-go="builder" id="f-builder">Teacher pack builder</button>
      <button type="button" class="link" data-go="about" id="f-about">About &amp; credits</button>
    </div>
  </footer>
  <noscript><p>ShareSafe Practice needs JavaScript to run the lessons.</p></noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
