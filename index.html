<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShareSafe Practice: private, offline fractions practice</title>
  <meta name="description" content="Free, offline-first fractions practice for shared and low-end devices. No accounts, no tracking.">
  <meta name="theme-color" content="#0b4f8a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header class="top">
    <a class="brand" href="./" data-go="home">ShareSafe Practice</a>
    <div class="toolbar" role="group" aria-label="Display and reading options">
      <button type="button" id="t-size" class="secondary">Text size: Normal</button>
      <button type="button" id="t-contrast" class="secondary" aria-pressed="false">High contrast</button>
      <button type="button" id="t-plain" class="secondary" aria-pressed="false">Plain language</button>
    </div>
  </header>
  <p id="net" class="net" role="status" hidden></p>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">
    <p><span id="mode-status"></span> <span id="sw-status"></span></p>
    <div class="row">
      <button type="button" class="secondary" data-go="code">Resume code</button>
      <button type="button" class="danger" data-go="end">End session</button>
      <button type="button" class="link" data-go="about">About &amp; credits</button>
    </div>
  </footer>
  <noscript><p>ShareSafe Practice needs JavaScript to generate practice problems.</p></noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
